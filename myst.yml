version: 1

project:
  id: comp521-fa26
  title: "COMP 521: Introduction to Scientific Computing and Data Science"
  short_title: COMP 521
  description: >-
    Computational methods for scientific problem-solving and data analysis in
    Python. Build numerical methods from first principles, test their limits,
    and use the scientific Python ecosystem to make claims from real data.
  authors:
    - name: Anna Rosen
      email: alrosen@sdsu.edu
      affiliations:
        - San Diego State University
      orcid: 0000-0003-4423-0660
  github: https://github.com/astrobytes-edu/comp521
  license:
    content: CC-BY-4.0
    code: MIT

  # These are tooling or private workspaces, not course content. MyST otherwise
  # discovers bibliography files recursively, even with an explicit TOC.
  exclude:
    - tools
    - _instructor
    - _planning
    - docs
    - tests
    - scripts
  bibliography: []

  # MyST's native Thebe/JupyterLite integration is currently site-wide in the
  # installed release. Keep it off so long reference readings remain static;
  # selected experiment cards use the scoped local Pyodide directive below.
  thebe: false
  # Serve the built xeus-python runtime in development as well as the published
  # site. Activities can therefore use one stable, base-path-aware Lite URL.
  static_files:
    - assets/jupyterlite
    - 09-lectures/media
    - 09-lectures/reveal
  plugins:
    - plugins/interactive-python/interactive-python.mjs
    - plugins/panel-pyodide/panel-pyodide.mjs
    - plugins/interactive-lecture/interactive-lecture.mjs
    - plugins/lecture-media/lecture-media.mjs

  numbering:
    heading_2: false
    figure: true
    equation: true

  toc:
