[project]
name = "comp521"
version = "0.1.0"
description = "COMP 521: Introduction to Scientific Computing and Data Science"
requires-python = ">=3.11,<3.14"

# Pinned floors, not exact pins: the readings execute at site-build time, and
# a silent minor-version drift that changes printed output would change the
# course content without anyone editing it.
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "ipykernel>=6.29",
    "ipython>=8.18",
    # MyST drives cell execution through a Jupyter server, not the kernel
    # directly; without this the build silently skips every executable cell.
    "jupyter-server>=2.14",
]

[dependency-groups]
dev = ["ruff>=0.6"]
