<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"><title>Symplectic structure, state accuracy, and physical energy are separate claims.</title><style>text{font:25px system-ui;fill:#26364c}.tick{font-size:30px}.label{font-size:32px;font-weight:600}.axis{stroke:#79879b;stroke-width:2;fill:none}.grid{stroke:#e4eaf1;stroke-width:1}path,polyline{stroke-linejoin:round;stroke-linecap:round}</style><rect x="70" y="15" width="760" height="125" rx="8" fill="#f4f7fb" stroke="#66768d" stroke-width="2" /><text class="label" x="100" y="59" style="fill:#66768d">Exact subflows</text><text x="100" y="103">Kick and drift each preserve canonical structure</text><path d="M450 140V173M440 163L450 173L460 163" fill="none" stroke="#087d72" stroke-width="3" /><rect x="70" y="178" width="760" height="125" rx="8" fill="#f4f7fb" stroke="#66768d" stroke-width="2" /><text class="label" x="100" y="222" style="fill:#66768d">Composition</text><text x="100" y="266">Fixed-step kick–drift–kick is symplectic</text><path d="M450 303V336M440 326L450 336L460 326" fill="none" stroke="#087d72" stroke-width="3" /><rect x="70" y="341" width="760" height="125" rx="8" fill="#f4f7fb" stroke="#66768d" stroke-width="2" /><text class="label" x="100" y="385" style="fill:#66768d">Distinct claims</text><text x="100" y="429">Second-order state error; energy still approximate</text></svg>