<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"><title>State, energy, and phase measurements answer different questions.</title><style>text{font:25px system-ui;fill:#26364c}.tick{font-size:30px}.label{font-size:32px;font-weight:600}.axis{stroke:#79879b;stroke-width:2;fill:none}.grid{stroke:#e4eaf1;stroke-width:1}path,polyline{stroke-linejoin:round;stroke-linecap:round}</style><rect x="40" y="60" width="820" height="100" rx="8" fill="#f4f7fb" stroke="#d1ddeb" /><text class="label" x="70" y="97">State error</text><text x="70" y="136">Compare to the exact state at the same coordinate</text><rect x="40" y="180" width="820" height="100" rx="8" fill="#f4f7fb" stroke="#d1ddeb" /><text class="label" x="70" y="217">Energy error</text><text x="70" y="256">Compare the specified invariant or physical energy</text><rect x="40" y="300" width="820" height="100" rx="8" fill="#f4f7fb" stroke="#d1ddeb" /><text class="label" x="70" y="337">Phase error</text><text x="70" y="376">Compare position along the oscillation</text></svg>