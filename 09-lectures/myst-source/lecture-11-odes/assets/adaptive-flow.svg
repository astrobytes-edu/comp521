<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"><title>Adaptive-step accept and reject data flow</title><style>text{font:24px system-ui;fill:#26364c}</style><rect x="160" y="20" width="580" height="90" rx="8" fill="#f3f7fb" stroke="#b9c7da" /><text x="178" y="55" font-weight="600">Propose a step</text><text x="178" y="92">Compute a candidate state</text><rect x="160" y="175" width="580" height="90" rx="8" fill="#f3f7fb" stroke="#b9c7da" /><text x="178" y="210" font-weight="600">Estimate scaled local error</text><text x="178" y="247">Compare with the selected criterion</text><rect x="20" y="370" width="405" height="110" rx="8" fill="#f3f7fb" stroke="#b9c7da" /><text x="38" y="405" font-weight="600">Accept</text><text x="38" y="442">Advance state and coordinate</text><rect x="475" y="370" width="405" height="110" rx="8" fill="#f3f7fb" stroke="#b9c7da" /><text x="493" y="405" font-weight="600">Reject</text><text x="493" y="442">Keep state; retry step</text><path d="M450 110V175M340 265L220 370M560 265L680 370" stroke="#087d72" stroke-width="3" fill="none" /><text x="135" y="320">meets criterion</text><text x="590" y="320">does not meet</text></svg>