name: Deploy course site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # MyST needs this to emit correct asset paths under a project subpath.
  BASE_URL: /comp521

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked MyST and Reveal dependencies
        working-directory: tools/myst-reveal
        run: npm ci

      # The readings contain ~203 executable cells; the site is only correct
      # if they actually run, so the Python env is a build dependency.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python environment
        run: uv sync --no-dev

      - name: Set up xeus JupyterLite builder
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: tools/jupyterlite/build-environment.yml
          environment-name: comp521-jupyterlite-build
          cache-environment: true

      - name: Build xeus JupyterLite runtime
        shell: bash -l {0}
        run: |
          JUPYTERLITE_PYTHON="$CONDA_PREFIX/bin/python" bash tools/jupyterlite/build.sh
          python3 scripts/check_jupyterlite_bundle.py --bundle-only

      - name: Check landing-page contract
        run: python3 scripts/check_landing_page.py

      - name: Check public repository boundary
        run: python3 scripts/check_public_boundary.py

      - name: Check MyST textbook directive fences
        run: python3 scripts/check_myst_directive_fences.py

      - name: Build site
        run: |
          source .venv/bin/activate
          tools/myst-reveal/node_modules/.bin/myst build --html --execute
          # MyST injects newly executed notebook outputs from its cache on the
          # following render.
          tools/myst-reveal/node_modules/.bin/myst build --html --execute
          cp -R assets/jupyterlite _build/html/jupyterlite
          mkdir -p _build/html/media
          cp -R 09-lectures/media/. _build/html/media/
          python3 scripts/check_lecture_media.py
          python3 scripts/check_jupyterlite_bundle.py

      - name: Build Software Engineering slides and handout
        run: |
          source .venv/bin/activate
          node tools/myst-reveal/src/build.mjs tools/myst-reveal/migrations/comp536 tools/myst-reveal/_build/production --deck software-engineering
          mkdir -p _build/html/reveal
          cp tools/myst-reveal/_build/production/software-engineering.html _build/html/reveal/
          cp tools/myst-reveal/_build/production/software-engineering.handout.html _build/html/reveal/

      - name: Check final publication boundary and SWE routes
        run: python3 scripts/check_public_boundary.py --site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
