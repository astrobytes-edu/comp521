<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="title desc">
  <title id="title">A bounded convergence algorithm</title><desc id="desc">An iterative algorithm declares state and a maximum iteration count, updates its estimate, and tests a residual. It either accepts convergence or reports a non-convergence outcome.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#173f5f"/></marker><style>.h{font:700 25px system-ui,sans-serif;fill:#102a43}.l{font:700 20px system-ui,sans-serif;fill:#102a43}.b{font:18px system-ui,sans-serif;fill:#243b53}.box{stroke:#173f5f;stroke-width:3;rx:14}.arr{stroke:#173f5f;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="600" height="520" fill="#f8fafc"/><text class="h" x="38" y="44">A loop ending is not convergence</text><rect class="box" x="90" y="80" width="420" height="76" fill="#d9eef7"/><text class="l" x="120" y="112">Declare state and stopping rules</text><text class="b" x="120" y="140">initial estimate · tolerance · maximum iterations</text><path class="arr" d="M300 158V205"/><rect class="box" x="90" y="210" width="420" height="70" fill="#e5f4e8"/><text class="l" x="120" y="242">Update estimate and compute residual</text><path class="arr" d="M300 282V325"/><rect class="box" x="90" y="330" width="420" height="70" fill="#fff3cd"/><text class="l" x="120" y="362">Residual ≤ tolerance?</text><text class="b" x="120" y="388">and no numerical failure?</text><path class="arr" d="M210 402V448"/><path class="arr" d="M390 402V448"/><rect class="box" x="55" y="450" width="250" height="52" fill="#d9eef7"/><text class="l" x="85" y="483">accept result</text><rect class="box" x="335" y="450" width="210" height="52" fill="#fce4ec"/><text class="l" x="360" y="483">report failure</text>
</svg>
