<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-labelledby="title desc">
  <title id="title">Representation and scaling in scientific code</title><desc id="desc">Two names point to the same mutable measurements list. Below, simple operation-count curves contrast constant, linear, and quadratic growth.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker><style>.h{font:700 25px system-ui,sans-serif;fill:#0f172a}.l{font:700 20px system-ui,sans-serif;fill:#172554}.b{font:18px system-ui,sans-serif;fill:#334155}.box{stroke:#2563eb;stroke-width:3;rx:12}.arr{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}.axis{stroke:#334155;stroke-width:3}.one{stroke:#64748b;stroke-width:4}.lin{stroke:#2563eb;stroke-width:4}.quad{stroke:#dc2626;stroke-width:4;fill:none}</style></defs>
  <rect width="600" height="560" fill="#f8fafc"/><text class="h" x="35" y="44">Representation choices matter</text><text class="b" x="35" y="72">for correctness and feasibility</text><text class="b" x="35" y="100">Two names can share one mutable object</text><rect class="box" x="45" y="118" width="150" height="58" fill="#dbeafe"/><text class="l" x="66" y="153">measurements</text><rect class="box" x="45" y="205" width="150" height="58" fill="#dbeafe"/><text class="l" x="92" y="240">backup</text><path class="arr" d="M198 147H280"/><path class="arr" d="M198 234H280"/><rect x="290" y="125" width="72" height="60" fill="#fff" stroke="#475569" stroke-width="2"/><rect x="362" y="125" width="72" height="60" fill="#fff" stroke="#475569" stroke-width="2"/><rect x="434" y="125" width="72" height="60" fill="#fff" stroke="#475569" stroke-width="2"/><text class="b" x="307" y="161">2.1</text><text class="b" x="379" y="161">2.4</text><text class="b" x="451" y="161">2.0</text><text class="b" x="290" y="220">mutation is visible</text><text class="b" x="290" y="244">through both names</text><text class="l" x="35" y="325">Growth describes operation counts, not timing</text><line class="axis" x1="95" y1="500" x2="510" y2="500"/><line class="axis" x1="95" y1="500" x2="95" y2="350"/><line class="one" x1="105" y1="455" x2="490" y2="455"/><line class="lin" x1="105" y1="486" x2="490" y2="385"/><path class="quad" d="M105 494Q370 485 490 350"/><text class="b" x="425" y="450">O(1)</text><text class="b" x="425" y="390">O(n)</text><text class="b" x="425" y="347">O(n²)</text><text class="b" x="95" y="540">input size →</text>
</svg>
