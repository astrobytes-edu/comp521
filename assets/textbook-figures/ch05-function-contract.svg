<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" role="img" aria-labelledby="title desc">
  <title id="title">A scientific function contract</title><desc id="desc">A stated input enters validation. Invalid input receives a clear exception, while valid input produces a result with documented meaning and units.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker><style>.h{font:700 25px system-ui,sans-serif;fill:#0f172a}.l{font:700 20px system-ui,sans-serif;fill:#172554}.b{font:18px system-ui,sans-serif;fill:#334155}.box{stroke-width:3;rx:14}.arr{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="600" height="510" fill="#f8fafc"/><text class="h" x="35" y="44">A function makes a public promise</text><rect class="box" x="90" y="80" width="420" height="76" fill="#dbeafe" stroke="#2563eb"/><text class="l" x="120" y="113">Inputs</text><text class="b" x="120" y="141">values · units · dtype · shape · declared domain</text><path class="arr" d="M300 158V202"/><rect class="box" x="90" y="207" width="420" height="76" fill="#fef3c7" stroke="#d97706"/><text class="l" x="120" y="240">Validate the stated boundary</text><text class="b" x="120" y="268">empty? finite? compatible? allowed state?</text><path class="arr" d="M205 285V338"/><path class="arr" d="M395 285V338"/><rect class="box" x="45" y="343" width="250" height="84" fill="#fee2e2" stroke="#dc2626"/><text class="l" x="75" y="377">Invalid</text><text class="b" x="75" y="405">raise a clear exception</text><rect class="box" x="325" y="343" width="230" height="84" fill="#dcfce7" stroke="#16a34a"/><text class="l" x="355" y="377">Valid</text><text class="b" x="355" y="405">return documented result</text><text class="b" x="55" y="475">Validation is a local software boundary, not model validation.</text>
</svg>
