<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" role="img" aria-labelledby="title desc">
  <title id="title">A computational result has a provenance chain</title><desc id="desc">Source values and assumptions pass through a recorded environment and an executed calculation to an interpreted result. A provenance record supports every link.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#173f5f"/></marker><style>.h{font:700 25px system-ui,sans-serif;fill:#102a43}.l{font:700 20px system-ui,sans-serif;fill:#102a43}.b{font:18px system-ui,sans-serif;fill:#243b53}.box{stroke:#173f5f;stroke-width:3;rx:14}.arr{stroke:#173f5f;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="600" height="510" fill="#f8fafc"/><text class="h" x="38" y="43">A result needs a visible provenance chain</text><rect class="box" x="45" y="80" width="205" height="110" fill="#d9eef7"/><text class="l" x="72" y="115">Source values</text><text class="b" x="72" y="146">data · units</text><text class="b" x="72" y="171">assumptions</text><rect class="box" x="350" y="80" width="205" height="110" fill="#e5f4e8"/><text class="l" x="378" y="115">Environment</text><text class="b" x="378" y="146">Python · packages · OS</text><path class="arr" d="M252 132H345"/><rect class="box" x="45" y="245" width="220" height="95" fill="#fff3cd"/><text class="l" x="72" y="280">Calculation</text><text class="b" x="72" y="310">declared command or code</text><rect class="box" x="335" y="245" width="220" height="95" fill="#fce4ec"/><text class="l" x="365" y="280">Interpretation</text><text class="b" x="365" y="310">claim with stated limits</text><path class="arr" d="M147 192V238"/><path class="arr" d="M452 192V238"/><path class="arr" d="M267 292H330"/><rect class="box" x="45" y="390" width="510" height="80" fill="#fff"/><text class="l" x="70" y="425">Provenance record</text><text class="b" x="70" y="452">inputs · command · interpreter · package versions · date</text>
</svg>
