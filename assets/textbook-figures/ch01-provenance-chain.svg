<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" role="img" aria-labelledby="title desc">
  <title id="title">A computational result has a provenance chain</title><desc id="desc">Source values and assumptions pass through a recorded environment and an executed calculation to an interpreted result. A provenance record supports every link.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#173f5f"/></marker><style>.h{font:700 25px system-ui,sans-serif;fill:#102a43}.l{font:700 20px system-ui,sans-serif;fill:#102a43}.b{font:18px system-ui,sans-serif;fill:#243b53}.box{stroke:#173f5f;stroke-width:3;rx:14}.arr{stroke:#173f5f;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="600" height="510" fill="#f8fafc"/><text class="h" x="38" y="43">A result needs a visible provenance chain</text><rect class="box" x="40" y="80" width="225" height="114" fill="#d9eef7"/><text class="l" x="65" y="115">Source values</text><text class="b" x="65" y="146">data · units</text><text class="b" x="65" y="171">assumptions</text><rect class="box" x="335" y="80" width="225" height="114" fill="#e5f4e8"/><text class="l" x="360" y="115">Environment</text><text class="b" x="360" y="146">Python · packages</text><text class="b" x="360" y="171">operating system</text><path class="arr" d="M267 132H330"/><rect class="box" x="40" y="250" width="225" height="114" fill="#fff3cd"/><text class="l" x="65" y="285">Calculation</text><text class="b" x="65" y="316">declared command</text><text class="b" x="65" y="341">or code</text><rect class="box" x="335" y="250" width="225" height="114" fill="#fce4ec"/><text class="l" x="360" y="285">Interpretation</text><text class="b" x="360" y="316">claim</text><text class="b" x="360" y="341">with limits</text><path class="arr" d="M152 196V243"/><path class="arr" d="M447 196V243"/><path class="arr" d="M267 307H330"/><rect class="box" x="40" y="400" width="520" height="92" fill="#fff"/><text class="l" x="65" y="434">Provenance record</text><text class="b" x="65" y="460">inputs · command · interpreter</text><text class="b" x="65" y="483">package versions · date</text>
</svg>
