<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
  <title id="title">Finite precision and claim-appropriate tolerances</title><desc id="desc">A target real value falls between stored floating-point values on a number line. A second line shows that an absolute and relative tolerance define a claim-specific comparison region.</desc>
  <defs><style>.h{font:700 25px system-ui,sans-serif;fill:#102a43}.l{font:700 20px system-ui,sans-serif;fill:#102a43}.b{font:18px system-ui,sans-serif;fill:#243b53}.axis{stroke:#102a43;stroke-width:3}.tick{stroke:#102a43;stroke-width:3}.stored{fill:#d1495b;stroke:#102a43;stroke-width:2}.target{fill:#1b998b;stroke:#102a43;stroke-width:2}.band{fill:#d9eef7;stroke:#52796f;stroke-width:3}</style></defs>
  <rect width="600" height="430" fill="#f8fafc"/><text class="h" x="35" y="45">Stored values approximate a real quantity</text><line class="axis" x1="75" y1="155" x2="525" y2="155"/><line class="tick" x1="150" y1="140" x2="150" y2="170"/><line class="tick" x1="300" y1="140" x2="300" y2="170"/><line class="tick" x1="450" y1="140" x2="450" y2="170"/><circle class="stored" cx="270" cy="155" r="10"/><circle class="target" cx="300" cy="155" r="11"/><circle class="stored" cx="332" cy="155" r="10"/><text class="l" x="238" y="110">stored A</text><text class="l" x="278" y="205">target</text><text class="l" x="345" y="110">stored B</text><text class="b" x="105" y="242">Python chooses a representable value near the real one.</text><text class="h" x="35" y="300">A comparison needs a stated tolerance</text><rect class="band" x="185" y="330" width="230" height="44" rx="10"/><circle class="target" cx="300" cy="352" r="10"/><text class="b" x="105" y="405">absolute scale + relative scale, chosen for the claim</text>
</svg>
