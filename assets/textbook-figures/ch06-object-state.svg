<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" role="img" aria-labelledby="title desc">
  <title id="title">A particle object keeps scientific state and behavior together</title><desc id="desc">A Particle blueprint declares mass, position, velocity, an invariant, and methods. An instance holds one state and can update its position or calculate a derived value.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker><style>.h{font:700 25px system-ui,sans-serif;fill:#0f172a}.l{font:700 20px system-ui,sans-serif;fill:#172554}.b{font:18px system-ui,sans-serif;fill:#334155}.box{stroke-width:3;rx:14}.arr{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="600" height="510" fill="#f8fafc"/><text class="h" x="35" y="44">Model an entity when state and behavior belong together</text><rect class="box" x="65" y="80" width="470" height="150" fill="#dbeafe" stroke="#2563eb"/><text class="l" x="100" y="115">Particle class · blueprint</text><text class="b" x="100" y="150">state: mass, position, velocity</text><text class="b" x="100" y="180">invariant: mass &gt; 0</text><text class="b" x="100" y="210">methods: kinetic_energy() · update_position(dt)</text><path class="arr" d="M300 232V278"/><text class="b" x="320" y="263">construct</text><rect class="box" x="65" y="283" width="470" height="130" fill="#dcfce7" stroke="#16a34a"/><text class="l" x="100" y="318">p1 · one particle instance</text><text class="b" x="100" y="352">mass = 1.0 g · position = (0, 0) cm</text><text class="b" x="100" y="382">p1.update_position(0.1) mutates its own state</text><text class="b" x="35" y="468">A class can enforce its declared invariant, not establish physical adequacy.</text>
</svg>
