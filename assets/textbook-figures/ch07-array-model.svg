<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" role="img" aria-labelledby="title desc">
  <title id="title">Shape, dtype, masks, and views are part of an array model</title><desc id="desc">A two-dimensional photometry array has star and filter axes. A Boolean mask selects rows. A final note distinguishes a slice that may share memory from fancy indexing that creates a copy.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2563eb"/></marker><style>.h{font:700 25px system-ui,sans-serif;fill:#0f172a}.l{font:700 20px system-ui,sans-serif;fill:#172554}.b{font:18px system-ui,sans-serif;fill:#334155}.cell{stroke:#475569;stroke-width:2}.arr{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="600" height="540" fill="#f8fafc"/><text class="h" x="35" y="44">An array carries more meaning than its values</text><text class="l" x="35" y="82">photometry · shape (4 stars, 3 filters) · float64</text><text class="b" x="42" y="148">stars ↓</text><text class="b" x="235" y="116">filters →</text><g transform="translate(190,130)"><rect class="cell" width="70" height="42" fill="#dbeafe"/><rect class="cell" x="70" width="70" height="42" fill="#dbeafe"/><rect class="cell" x="140" width="70" height="42" fill="#dbeafe"/><rect class="cell" y="42" width="70" height="42" fill="#fff"/><rect class="cell" x="70" y="42" width="70" height="42" fill="#fff"/><rect class="cell" x="140" y="42" width="70" height="42" fill="#fff"/><rect class="cell" y="84" width="70" height="42" fill="#dbeafe"/><rect class="cell" x="70" y="84" width="70" height="42" fill="#dbeafe"/><rect class="cell" x="140" y="84" width="70" height="42" fill="#dbeafe"/><rect class="cell" y="126" width="70" height="42" fill="#fff"/><rect class="cell" x="70" y="126" width="70" height="42" fill="#fff"/><rect class="cell" x="140" y="126" width="70" height="42" fill="#fff"/></g><path class="arr" d="M295 305V348"/><rect x="80" y="353" width="440" height="70" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text class="l" x="110" y="385">quality mask: [True, False, True, False]</text><text class="b" x="110" y="411">select rows; preserve the remaining axes</text><text class="b" x="35" y="472">slice: may share memory · fancy indexing: copy</text><text class="b" x="35" y="505">inspect shape, dtype, selection, and ownership</text>
</svg>
