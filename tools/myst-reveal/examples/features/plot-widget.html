<!doctype html><html lang="en"><meta charset="utf-8"><title>Interactive quadratic plot</title>
<style>body{font:20px system-ui;margin:14px;color:#16181d}input{width:60%;accent-color:#2f6f6f}svg{width:100%;height:280px}text{font:18px system-ui;fill:#16181d}</style>
<label>Coefficient a: <input id="a" aria-label="Coefficient a" type="range" min="0" max="2" step="0.1" value="1"> <output id="value">1</output></label>
<svg viewBox="0 0 600 280" role="img" aria-labelledby="title description"><title id="title">y equals a times x squared</title><desc id="description">The coefficient changes the curvature over x from minus two to two.</desc><path d="M40 230H570M305 240V20" fill="none" stroke="#5c6470"/><text x="580" y="220">x</text><text x="315" y="25">y</text><text x="28" y="255">−2</text><text x="555" y="255">2</text><text x="285" y="255">0</text><text x="315" y="55">8</text><polyline id="curve" fill="none" stroke="#2f6f6f" stroke-width="4"/></svg>
<script>const a=document.getElementById('a');function update(){document.getElementById('value').value=a.value;const points=Array.from({length:101},(_,i)=>{const x=-2+i/25;return (305+x*132.5)+','+(230-Number(a.value)*x*x*24)});document.getElementById('curve').setAttribute('points',points.join(' '))}a.addEventListener('input',update);update();</script></html>
