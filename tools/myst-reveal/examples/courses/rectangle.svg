<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" role="img" aria-labelledby="title desc">
  <title id="title">Area depends on width and height</title>
  <desc id="desc">Width five and height two flow into area equals width times height, producing ten.</desc>
  <rect width="840" height="230" fill="#fff"/>
  <g fill="#eef1f5" stroke="#5a5a8a" stroke-width="2">
    <rect x="20" y="25" width="190" height="70" rx="10"/>
    <rect x="20" y="135" width="190" height="70" rx="10"/>
    <rect x="320" y="70" width="240" height="90" rx="10"/>
    <rect x="660" y="70" width="150" height="90" rx="10"/>
  </g>
  <g stroke="#2f6f6f" stroke-width="4" fill="none">
    <path d="M210 60L300 100M210 170L300 130M560 115H640"/>
    <path d="M285 86L300 100L280 102M280 128L300 130L285 144M625 103L640 115L625 127"/>
  </g>
  <g fill="#16181d" font-family="system-ui,sans-serif" font-size="28" text-anchor="middle">
    <text x="115" y="70">width = 5</text><text x="115" y="180">height = 2</text>
    <text x="440" y="125">area = w × h</text><text x="735" y="125">10</text>
  </g>
</svg>
